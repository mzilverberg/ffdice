name: Create release, and publish Python 🐍 distribution 📦 to TestPyPI

# Action is triggered on every push to the repository, but not on the main branch.
on:
  push:
    branches-ignore:
      - main

jobs:
  bump-version:
    name: Bump development version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Define new development version 🆕
      id: semver
      uses: PaulHatch/semantic-version@v6.0.0
      with:
        tag_prefix: ""
        major_pattern: "/!:|BREAKING:/"
        minor_pattern: "/feat:/"
        version_format: "${major}.${minor}.${patch}-dev${increment}"
        namespace: "dev"
    - name: Output new version 🔖
      run: echo "New version is ${{ steps.semver.outputs.version }}"

